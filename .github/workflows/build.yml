name: build

on:
  push:
    branches: [main]
    # Flux's image automation commits tag bumps to k8s/; ignoring it keeps
    # those commits from triggering a rebuild loop.
    paths-ignore:
      - 'k8s/**'
      - 'flux/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build (renders PDF, builds Astro)
        run: npm run build

      - name: Validate HTML
        run: npm run lint:html

      - name: Lighthouse CI
        id: lhci
        continue-on-error: true
        run: npx lhci autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14

      - name: Annotate Lighthouse outcome
        if: always()
        run: |
          if [ "${{ steps.lhci.outcome }}" = "failure" ]; then
            echo "::warning title=Lighthouse below threshold::See the lighthouse-reports artifact for which audits dropped a score."
          else
            echo "::notice title=Lighthouse passed::All categories met thresholds."
          fi

      - name: Compute short SHA
        id: sha
        run: |
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: bgautrea
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            docker.io/bgautrea/briangautreau-com:main-${{ steps.sha.outputs.short }}-${{ steps.sha.outputs.ts }}
            docker.io/bgautrea/briangautreau-com:${{ steps.sha.outputs.short }}
            docker.io/bgautrea/briangautreau-com:latest

      - name: Summary
        run: |
          echo "::notice title=Image::docker.io/bgautrea/briangautreau-com:main-${{ steps.sha.outputs.short }}-${{ steps.sha.outputs.ts }} (Flux rolls it out within ~5 min)"
