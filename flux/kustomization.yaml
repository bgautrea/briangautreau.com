# Convenience aggregate so the whole set can be applied in one go:
#   KUBECONFIG=~/.kube/config.do kubectl apply -k flux/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - gitrepository.yaml
  - flux-kustomization.yaml
  - image-repository.yaml
  - image-policy.yaml
  - image-update-automation.yaml
